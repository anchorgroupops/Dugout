name: Build & Deploy Images

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: anchorgroupops

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/sharks-dashboard:latest
            ghcr.io/${{ env.OWNER }}/sharks-dashboard:${{ github.sha }}
          build-args: |
            VITE_SPOTIFY_CLIENT_ID=0f24c048c5af4e8aaf82da48482ec1fd
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.scraper
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/sharks-api:latest
            ghcr.io/${{ env.OWNER }}/sharks-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-deploy:
    runs-on: ubuntu-latest
    # Deploy is Watchtower-only. The old notify-deploy webhook made sharks_api
    # SSH to the host and `docker compose up -d`, which stopped its own
    # container mid-recreate and left sharks_api/sharks_sync in `Created`
    # (never started) — a 502 outage until someone ran `docker start`.
    needs: [build-dashboard, build-api]
    if: success()
    steps:
      - name: Health check dugout.joelycannoli.com
        # Budget covers: GHCR propagation (~seconds), Watchtower poll (60s),
        # image pull on Pi (~1 min), rolling restart (brief 502 window).
        # 60s initial + 36 * 30s = 19 min ceiling. Generous buffer avoids
        # spurious CI failure emails from tight-timing edge cases.
        run: |
          sleep 60
          for i in $(seq 1 36); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              https://dugout.joelycannoli.com/api/health --max-time 15 || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            sleep 30
          done
          echo "Health check failed after 36 attempts (~18 min)."
          exit 1
