[pytest]
testpaths = tests
addopts =
    --strict-markers
    --tb=short
    -ra
# Dump every thread's stack if one test runs > 2 min, so a CI hang names
# the frozen line instead of silently burning the 6-hour job limit.
faulthandler_timeout = 120
filterwarnings =
    ignore::DeprecationWarning:pdfplumber.*
    ignore::DeprecationWarning:pypdf.*
    ignore::UserWarning:matplotlib.*
markers =
    slow: tests that hit the network or take > 1s
    property: hypothesis property-based tests
